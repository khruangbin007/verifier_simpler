# The pipeline: six steps, in order. Each is named, versioned, and carried out either by a person or by
# one function named here. Only functions listed in STEP_FUNCTIONS of the engine may be named; nothing is
# loaded by path. A step's version is part of the provenance of every record it writes, so a change to how
# a step works is a change to its version here.
engine_version: 0.0.4
steps:
- id: '01'
  name: prepare-run
  version: 0.0.2
  carried_out_by: prepare_run
- id: '02'
  name: read-inputs
  version: 0.0.1
  carried_out_by: read_inputs
- id: '03'
  name: build-map
  version: 0.0.1
  carried_out_by: build_map
- id: '04'
  name: confirm-outline
  version: 0.0.2
  carried_out_by: a person
  human: true
- id: '05'
  name: read-with-ai
  version: 0.0.1
  carried_out_by: read_with_ai
- id: '06'
  name: link-units
  version: 0.0.1
  carried_out_by: link_units
