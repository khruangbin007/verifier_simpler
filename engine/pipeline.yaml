# The pipeline: eighteen steps, in order. Each is named, versioned, and carried out either by a
# person or by one function named here. Only functions listed in STEP_FUNCTIONS of the runner
# may be named; nothing is loaded by path. A step's version is part of the provenance of every
# record it writes, so a change to how a step works is a change to its version here.
engine_version: "0.0.2"
steps:
  - id: "01"
    name: prepare-run
    version: "0.0.2"
    carried_out_by: runner.prepare_run
  - id: "02"
    name: read-methodology
    version: "0.0.4"
    carried_out_by: reading.read_methodology
  - id: "03"
    name: read-documentation
    version: "0.0.4"
    carried_out_by: reading.read_documentation
  - id: "04"
    name: read-package
    version: "0.0.4"
    carried_out_by: reading.read_package
  - id: "05"
    name: build-graph
    version: "0.0.1"
    carried_out_by: review.build_graph
  - id: "06"
    name: find-candidates
    version: "0.0.1"
    carried_out_by: review.find_candidates
    with: {pass: 1}
  - id: "07"
    name: confirm-outline
    version: "0.0.2"
    carried_out_by: a person
    human: true
  - id: "07a"
    name: interpret-code
    version: "0.0.1"
    carried_out_by: review.interpret_code
  - id: "08"
    name: judge-links
    version: "0.0.1"
    carried_out_by: review.judge_links
    with: {pass: 1}
  - id: "09"
    name: find-candidates
    version: "0.0.1"
    carried_out_by: review.find_candidates
    with: {pass: 2}
  - id: "10"
    name: judge-links
    version: "0.0.1"
    carried_out_by: review.judge_links
    with: {pass: 2}
  - id: "11"
    name: check-mathematics
    version: "0.0.1"
    carried_out_by: review.check_mathematics
  - id: "12"
    name: check-values
    version: "0.0.1"
    carried_out_by: review.check_values
  - id: "13"
    name: check-rules
    version: "0.0.1"
    carried_out_by: review.check_rules
  - id: "14"
    name: check-package-docs
    version: "0.0.1"
    carried_out_by: review.check_package_docs
  - id: "15"
    name: account-coverage
    version: "0.0.1"
    carried_out_by: review.account_coverage
  - id: "16"
    name: await-determinations
    version: "0.0.1"
    carried_out_by: a person
    human: true
  - id: "17"
    name: record-determinations
    version: "0.0.1"
    carried_out_by: runner.record_determinations
  - id: "18"
    name: build-report
    version: "0.0.1"
    carried_out_by: runner.build_report
