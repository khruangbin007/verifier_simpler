# Answers a model may give to a judge question, and what the validators must do with each.
# The question shows passages [A], [B], [C]; one of them is a planted control passage (marked
# PLANTED below and replaced by its letter in the test). Quotations that are verbatim:
#   unit:    "pmax(pd, floor)"          passage GOOD: "never taken below 0.03%"
# expected: accepted, or the index of the reason in REJECTION_REASONS
#   0 could not be read | 1 named a passage not shown | 2 quoted words not in the text
#   3 accepted a planted control passage | 4 contradicted itself
answers:
  - {name: "a clean answer", expected: accepted,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}], "none_reason": ""}'}
  - {name: "a thought block and a code fence around a clean answer", expected: accepted,
     text: "<think>The floor looks right. {\"matches\": []}</think>\n```json\n{\"matches\": [{\"letter\": \"GOOD\", \"relation\": \"implements\", \"confidence\": 90, \"quote_from_passage\": \"never taken below 0.03%\", \"quote_from_unit\": \"pmax(pd, floor)\"}], \"none_reason\": \"\"}\n```"}
  - {name: "prose before the object", expected: accepted,
     text: 'Here is my answer: {"matches": [], "none_reason": "Nothing fits."}'}
  - {name: "quotation with different white space", expected: accepted,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 80, "quote_from_passage": "never   taken below\n0.03%", "quote_from_unit": "pmax(pd,  floor)"}], "none_reason": ""}'}
  - {name: "no JSON at all", expected: 0, text: "I think passage A matches well."}
  - {name: "empty answer", expected: 0, text: ""}
  - {name: "broken JSON is not repaired", expected: 0, text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90,, }]}'}
  - {name: "a repeated key", expected: 0, text: '{"matches": [], "matches": [], "none_reason": "x"}'}
  - {name: "a list instead of an object", expected: 0, text: '[{"letter": "GOOD"}]'}
  - {name: "an unknown field", expected: 0, text: '{"matches": [], "none_reason": "x", "importance": "very"}'}
  - {name: "a relation outside the closed list", expected: 0,
     text: '{"matches": [{"letter": "GOOD", "relation": "matches", "confidence": 90, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "confidence as text", expected: 0,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": "high", "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "confidence out of range", expected: 0,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 140, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "a letter that was not shown", expected: 1,
     text: '{"matches": [{"letter": "Q", "relation": "implements", "confidence": 90, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "a paraphrased quotation", expected: 2,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "is never below 0.03 percent", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "a quotation with an ellipsis", expected: 2,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "never ... below 0.03%", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "a quotation taken from another passage", expected: 2,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "reviewed every year", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "a quotation from the unit that is not in the unit", expected: 2,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "max(pd, 0.0003)"}]}'}
  - {name: "a missing quotation", expected: 2,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "the planted passage accepted", expected: 3,
     text: '{"matches": [{"letter": "PLANTED", "relation": "implements", "confidence": 70, "quote_from_passage": "parcels are weighed", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "the planted passage called merely related is fine", expected: accepted,
     text: '{"matches": [{"letter": "PLANTED", "relation": "merely related", "confidence": 20, "quote_from_passage": "parcels are weighed", "quote_from_unit": "pmax(pd, floor)"}]}'}
  - {name: "matches and a reason for none", expected: 4,
     text: '{"matches": [{"letter": "GOOD", "relation": "implements", "confidence": 90, "quote_from_passage": "never taken below 0.03%", "quote_from_unit": "pmax(pd, floor)"}], "none_reason": "Nothing fits."}'}
