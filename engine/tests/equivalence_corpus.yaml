  - {name: "a sign under the root", expect: different, code: "y = sqrt(1 - r)", stated: "y = sqrt(1 + r)"}
  - {name: "a square that moved", expect: different, code: "y = a*b^2", stated: "y = (a*b)^2"}
  - {name: "a surcharge rate", expect: different, code: "y = a*1.125", stated: "y = a*1.25"}
  - {name: "a branch that lost its sign", expect: different, code: "y = piecewise(x > 0, x, -x)", stated: "y = piecewise(x > 0, x, x)"}
  - {name: "a changed cap on a scaled quantity", expect: different, code: "y = min(0.22, 0.01*n)", stated: "y = min(0.2, 0.01*n)"}
  - {name: "a changed floor on a scaled quantity", expect: different, code: "y = max(0.5*x, 45)", stated: "y = max(0.5*x, 40)"}
