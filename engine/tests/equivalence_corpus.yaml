  - {name: "exp of a sum taken apart", expect: different, code: "y = exp(a + b)", stated: "y = exp(a) + exp(b)"}
  - {name: "log of a product taken apart", expect: different, code: "y = ln(a*b)", stated: "y = ln(a)*ln(b)"}
